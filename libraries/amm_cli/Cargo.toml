[package]
name = "amm-cli"
version = "0.1.0"
edition = "2021"

[features]
devnet = ["raydium_amm/devnet"]

[dependencies]
anchor-client = "=0.29.0"
anchor-lang   = "=0.29.0"

# Point at your fork of raydium_amm:
raydium_amm   = { git = "ssh://git@github.com:francescos123/raydium-amm.git", branch = "solana-2.2-upgrade", default-features = false, features = ["client","no-entrypoint"] }

# Point at your fork of openbook‑dex (serum_dex):
serum_dex     = { git = "ssh://git@github.com:francescos123/openbook-dex.git", branch = "solana-2.2-upgrade", default-features = false, features = ["client","no-entrypoint"] }

common                        = { path = "../common" }
spl-token                     = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account  = { version = "2.2.0", features = ["no-entrypoint"] }
spl-token-2022                = { version = "0.9.0", features = ["no-entrypoint"] }

# Update these to match your bot’s Solana versions:
solana-client                 = "2.2.1"
solana-sdk                    = "2.2.1"

anyhow                        = "1.0"
safe-transmute                = "0.11.2"
arrayref                      = "0.3.6"
clap                          = { version = "4.1.8", features = ["derive"] }
toml                          = "0.8.19"
hex                           = "0.4.3"
bs58                          = "0.5.1"

[lib]
crate-type = ["cdylib", "lib"]
